<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <style>
    :root {
      --bg: #0f0f13;
      --bg-gradient: linear-gradient(145deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      --card: rgba(255, 255, 255, 0.06);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --primary: #818cf8;
      --primary-strong: #6366f1;
      --primary-glow: rgba(99, 102, 241, 0.35);
      --success: #34d399;
      --danger: #f87171;
      --danger-bg: rgba(248, 113, 113, 0.12);
      --completed: #64748b;
      --radius: 16px;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      background-image: 
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99, 102, 241, 0.25), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(139, 92, 246, 0.15), transparent);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px 60px;
      line-height: 1.5;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 32px;
    }

    header h1 {
      font-size: 2.1rem;
      font-weight: 800;
      letter-spacing: -0.8px;
      background: linear-gradient(135deg, #e0e7ff 0%, #a5b4fc 40%, #c4b5fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }

    header p {
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 400;
    }

    /* Card */
    .card {
      background: var(--card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 20px;
    }

    /* Form */
    #todo-form {
      display: flex;
      gap: 10px;
    }

    #todo-input {
      flex: 1;
      padding: 15px 18px;
      border: 1.5px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
      color: var(--text);
      background: rgba(0, 0, 0, 0.25);
      transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
    }

    #todo-input::placeholder {
      color: #64748b;
    }

    #todo-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-glow);
      background: rgba(0, 0, 0, 0.35);
    }

    #todo-form button {
      padding: 0 24px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.25s, filter 0.2s;
      white-space: nowrap;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
    }

    #todo-form button:hover {
      filter: brightness(1.1);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
    }

    #todo-form button:active {
      transform: scale(0.96);
    }

    /* Stats bar */
    .stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.875rem;
      color: var(--muted);
      margin-bottom: 14px;
      padding: 0 6px;
    }

    .stats .count {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stats .count span {
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
      font-weight: 600;
      font-size: 0.8rem;
      padding: 2px 10px;
      border-radius: 20px;
    }

    .stats button {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.85rem;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .stats button:hover {
      color: var(--danger);
      background: var(--danger-bg);
    }

    /* Progress bar */
    .progress-wrap {
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      margin-bottom: 18px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #a78bfa);
      border-radius: 4px;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.5);
    }

    /* List */
    #todo-list {
      list-style: none;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      background: var(--card);
      backdrop-filter: blur(8px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      margin-bottom: 10px;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .todo-item:hover {
      border-color: rgba(255, 255, 255, 0.14);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-12px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .todo-item.completed {
      opacity: 0.65;
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: var(--completed);
    }

    /* Checkbox */
    .checkbox {
      width: 24px;
      height: 24px;
      border: 2px solid #475569;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      background: transparent;
    }

    .checkbox:hover {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    .todo-item.completed .checkbox {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-color: transparent;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.4);
    }

    .checkbox svg {
      width: 13px;
      height: 13px;
      stroke: white;
      stroke-width: 2.8;
      fill: none;
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .todo-item.completed .checkbox svg {
      opacity: 1;
      transform: scale(1);
    }

    .todo-text {
      flex: 1;
      font-size: 1.02rem;
      word-break: break-word;
      cursor: pointer;
      user-select: none;
      transition: color 0.2s;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #475569;
      cursor: pointer;
      padding: 8px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
      opacity: 0.7;
    }

    .todo-item:hover .delete-btn {
      opacity: 1;
    }

    .delete-btn:hover {
      color: var(--danger);
      background: var(--danger-bg);
    }

    .delete-btn svg {
      width: 18px;
      height: 18px;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 52px 24px;
      color: var(--muted);
    }

    .empty-state .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      background: rgba(99, 102, 241, 0.12);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .empty-state .icon svg {
      width: 34px;
      height: 34px;
      color: #818cf8;
      opacity: 0.9;
    }

    .empty-state p {
      font-size: 1.05rem;
      margin-bottom: 4px;
      color: #cbd5e1;
    }

    .empty-state span {
      font-size: 0.9rem;
      opacity: 0.7;
    }

    /* Responsive */
    @media (max-width: 480px) {
      body {
        padding: 28px 12px 48px;
      }

      header h1 {
        font-size: 1.8rem;
      }

      .card {
        padding: 16px;
      }

      #todo-form {
        flex-direction: column;
      }

      #todo-form button {
        padding: 15px;
      }

      .todo-item {
        padding: 14px 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>To-Do List</h1>
      <p>Focus. Finish. Feel good.</p>
    </header>

    <div class="card">
      <form id="todo-form">
        <input
          type="text"
          id="todo-input"
          placeholder="What needs to be done?"
          autocomplete="off"
          required
        >
        <button type="submit">Add Task</button>
      </form>
    </div>

    <div id="progress-section" style="display: none;">
      <div class="stats">
        <div class="count">
          <span id="task-count">0</span>
          remaining
        </div>
        <button id="clear-completed" type="button">Clear completed</button>
      </div>
      <div class="progress-wrap">
        <div class="progress-bar" id="progress-bar" style="width: 0%"></div>
      </div>
    </div>

    <ul id="todo-list"></ul>
  </div>

  <script>
    const form = document.getElementById("todo-form");
    const input = document.getElementById("todo-input");
    const list = document.getElementById("todo-list");
    const progressSection = document.getElementById("progress-section");
    const taskCount = document.getElementById("task-count");
    const progressBar = document.getElementById("progress-bar");
    const clearCompletedBtn = document.getElementById("clear-completed");

    let todos = JSON.parse(localStorage.getItem("todos")) || [];

    function saveTodos() {
      localStorage.setItem("todos", JSON.stringify(todos));
    }

    function render() {
      list.innerHTML = "";

      if (todos.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
              </svg>
            </div>
            <p>No tasks yet</p>
            <span>Add your first task above</span>
          </div>
        `;
        progressSection.style.display = "none";
        return;
      }

      progressSection.style.display = "block";

      const remaining = todos.filter(t => !t.completed).length;
      const total = todos.length;
      const percent = total === 0 ? 0 : Math.round(((total - remaining) / total) * 100);

      taskCount.textContent = remaining;
      progressBar.style.width = percent + "%";

      todos.forEach(todo => {
        const li = document.createElement("li");
        li.className = `todo-item${todo.completed ? " completed" : ""}`;
        li.dataset.id = todo.id;

        li.innerHTML = `
          <div class="checkbox" role="checkbox" aria-checked="${todo.completed}" tabindex="0">
            <svg viewBox="0 0 24 24">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
          <span class="todo-text">${escapeHtml(todo.text)}</span>
          <button class="delete-btn" aria-label="Delete task" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
              <line x1="10" y1="11" x2="10" y2="17"/>
              <line x1="14" y1="11" x2="14" y2="17"/>
            </svg>
          </button>
        `;

        const checkbox = li.querySelector(".checkbox");
        const text = li.querySelector(".todo-text");

        const toggle = () => {
          todo.completed = !todo.completed;
          saveTodos();
          render();
        };

        checkbox.addEventListener("click", toggle);
        text.addEventListener("click", toggle);

        checkbox.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            toggle();
          }
        });

        li.querySelector(".delete-btn").addEventListener("click", () => {
          todos = todos.filter(t => t.id !== todo.id);
          saveTodos();
          render();
        });

        list.appendChild(li);
      });
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      todos.unshift({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2),
        text,
        completed: false
      });

      input.value = "";
      saveTodos();
      render();
      input.focus();
    });

    clearCompletedBtn.addEventListener("click", () => {
      todos = todos.filter(t => !t.completed);
      saveTodos();
      render();
    });

    render();
  </script>
</body>
</html>
